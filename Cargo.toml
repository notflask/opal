[package]
name = "opal"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cosmic-text = "0.19.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = "0.21.1"
tiny-skia = "0.12.0"
toml = "1.1.8"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wl-clipboard-rs = "0.9.4"

[dev-dependencies]
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# pixel loops are unusably slow unoptimized
[profile.dev]
opt-level = 2
